[package]
name = "askar-storage"
version = "0.2.5"
authors = ["Hyperledger Aries Contributors <aries@lists.hyperledger.org>"]
edition = "2021"
description = "Askar secure storage support"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/openwallet-foundation/askar/"
categories = ["cryptography", "database"]
keywords = ["encryption", "signatures", "ssi", "verifiable", "credentials"]
rust-version = "1.94"

[package.metadata.docs.rs]
features = ["all_backends"]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
all_backends = ["any", "postgres", "sqlite"]
any = []
default = ["all_backends", "log"]
migration = ["dep:rmp-serde", "dep:sqlx", "dep:sqlx-core", "sqlx?/macros"]
pg_test = ["postgres"]
postgres = ["dep:sqlx", "dep:sqlx-core", "sqlx?/postgres", "sqlx?/tls-rustls"]
sqlite = ["dep:sqlx", "dep:sqlx-core", "sqlx?/sqlite"]

[dependencies]
arc-swap = "1.7"
async-lock = "3.4"
async-stream = "0.3"
bs58 = "0.5"
chrono = "0.4"
ciborium = "0.2"
digest = "0.11"
futures-lite = "2.6"
hex = "0.4"
hmac = "0.13"
itertools = "0.14"
log = { version = "0.4", optional = true }
once_cell = "1.21"
percent-encoding = "2.3"
rmp-serde = { version = "1.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1.48", features = ["rt-multi-thread", "time"] }
url = { version = "2.5", default-features = false }
uuid = { version = "1.19", features = ["v4"] }
zeroize = "1.8"

[dependencies.askar-crypto]
default-features = false
features = ["alloc", "argon2", "chacha", "std_rng"]
path = "../askar-crypto"
version = "0.4"

[dependencies.sqlx]
default-features = false
features = ["chrono", "runtime-tokio"]
optional = true
version = "0.9"

[dependencies.sqlx-core]
# needed for the TransactionManager trait, which is not re-exported by sqlx
version = "0.9"
optional = true

[dev-dependencies]
env_logger = "0.11"
hex-literal = "1.1"
rand = { version = "0.10" }

[[test]]
name = "backends"
